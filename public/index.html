<!DOCTYPE html>
<html lang="en">

<head>
    <title>Verbena</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
    <link rel="icon" type="image/x-icon" href="/assets/duck.jpg">
</head>

<link href="https://fonts.cdnfonts.com/css/br-segma" rel="stylesheet">
<link href="https://fonts.cdnfonts.com/css/manjari-2" rel="stylesheet">

<link rel="stylesheet" href="/style.css">

<body>

    <div id="header">
        <img id="header-logo" src="/assets/placeholder.png" alt="Blog Logo">
        <div id="header-text-group">
            <p id="header-title">Title</p>
            <p id="header-subtitle">Subtitle</p>
        </div>
        <div id="header-searchbar-group">
            <label id="header-searchbar-label" for="header-searchbar">Search Blog</label>
            <input id="header-searchbar" placeholder="Type something...">
        </div>
    </div>

    <div id="page">
        <div id="sidebar">
            <div id="sidebar-links-container"></div>
        </div>

        <!-- TODO: Make a content area and rename content-page -->

        <div id="content-page" style="display: none;">

            <!-- TODO: Either split the content page into seperate pages and have a page number selector, or only load a certain amount of posts at a time -->

        </div>

        <div id="post-page" style="display: none;">
            <div class="page-inner" id="post-page-inner">
                <a class="small-text" id="post-page-return">
                    <p>Return</p>
                </a>
                <h1 class="large-text" id="post-page-title">Post Title</h1>
                <p class="normal-text" id="post-page-content">Post Content</p>
                <!--
                <div class="post-image-container">
                    <img class="post-image" src="/assets/duck.jpg" alt="Alt Text" title="Alt Text">
                    <img class="post-image" src="/assets/placeholder.png" alt="Alt Text" title="Alt Text">
                </div>
                -->
                <small class="small-text" id="post-page-info">Post Info</small>
                <br>

                <!-- TODO: Possibly make these buttons be in the same spot every time -->
                <p id="post-page-arrow-group" class="small-text">
                    <a id="post-page-previous">« Previous Post</a> | <a id="post-page-number">Post Number</a> | <a
                        id="post-page-next">Next Post »</a>
                </p>
            </div>
        </div>

        <div id="edit-page" style="display: none;">
            <div class="page-inner" id="edit-page-inner">
                <a class="small-text" id="edit-page-return">
                    <p>Return</p>
                </a>
                
                <h1 class="large-text">Post Creator</h1>

                <label class="normal-text" for="edit-page-title">Title</label>
                <br>
                <input id="edit-page-title">
                <br>

                <label class="normal-text" for="edit-page-content">Content</label>
                <br>
                <textarea id="edit-page-content"></textarea>
                <br>

                <button id="edit-page-save">Create Post</button>

                <p id="edit-page-notice">...</p>
            </div>
        </div>
    </div>

    <div id="image-viewer" style="display: none;">
        <img class="viewer-image" alt="Alt Text" title="Alt Text" src="/assets/placeholder.png">
        <p class="image-viewer-text">Alt Text</p>
        <small class="image-viewer-instructions">Click anywhere to close</small>
    </div>

    <!-- Example Post -->
    <div class="post" style="display: none;">
        <span class="large-text">Post Title <img class="post-link" src="/assets/link.png" alt="Copy link to post"
                title="Copy link to post"></span>
        <p class="normal-text">Post Content</p>
        <div class="post-image-container">
            <img class="post-image" src="/assets/placeholder.png" alt="Post Img 1" title="Post Img 1">
            <img class="post-image" src="/assets/placeholder.png" alt="Post Img 2" title="Post Img 2">
        </div>
        <small class="small-text">Post Info</small>
    </div>
</body>

<script src="/script.js"></script>

</html>
