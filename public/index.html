<!DOCTYPE html>
<html lang="en">

<head>
    <title>Verbena</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
    <link rel="icon" type="image/x-icon" href="/assets/duck.jpg">
</head>

<link href="https://fonts.cdnfonts.com/css/br-segma" rel="stylesheet">
<link href="https://fonts.cdnfonts.com/css/manjari-2" rel="stylesheet">
<link href="https://fonts.cdnfonts.com/css/red-hat-mono" rel="stylesheet">

<link rel="stylesheet" href="/style.css">

<body>

    <div id="header">
        <a class="link-text" id="header-logo-link"><img id="header-logo" src="/assets/placeholder.png" alt="Blog Logo"></a>
        <div id="header-text-group">
            <p id="header-title"></p>
            <p id="header-subtitle"></p>
        </div>
        <div id="header-searchbar-group">
            <label id="header-searchbar-label" for="header-searchbar">Search</label>
            <input id="header-searchbar" placeholder="Type something...">
        </div>
    </div>

    <div id="page">
        <div id="sidebar">
            <div id="sidebar-links-container"></div>
        </div>

        <div id="content">
            <div id="list-page" class="page" style="display: none;">

                <!-- TODO: Either split the content page into seperate pages and have a page number selector, or only load a certain amount of posts at a time -->

            </div>

            <div id="post-page" class="page" style="display: none;">
                <a class="small-text" id="post-page-return">
                    <p>Return</p>
                </a>
                <p class="large-text page-title" id="post-page-title"></p>

                <small class="small-text" id="post-page-info"></small>
                
                <p id="post-page-arrow-group" class="small-text">
                    <a class="link-text" id="post-page-previous">« Previous Post</a> | <a id="post-page-number">#</a> |
                    <a id="post-page-next" class="link-text">Next Post »</a>
                </p>
                
                <p class="post-markdown-container" id="post-page-content"></p>
                <!--
                    <div class="post-image-container">
                    <img class="post-image" src="/assets/duck.jpg" alt="Alt Text" title="Alt Text">
                    <img class="post-image" src="/assets/placeholder.png" alt="Alt Text" title="Alt Text">
                    </div>
                    -->
                

                <button class="small-text text-button" id="post-page-raw">View Raw</button>
                <button class="small-text text-button" id="post-page-delete">Delete this Post</button>
            </div>

            <div id="edit-page" class="page" style="display: none;">
                <div id="edit-page-left">
                    <a class="small-text" id="edit-page-return">
                        <p>Return</p>
                    </a>

                    <p class="large-text page-title" id="edit-page-title">Create a Post</p>

                    <label class="small-text" for="edit-page-id-input">Post ID to Edit</label>
                    <input class="small-text" id="edit-page-id-input" placeholder="Type something...">

                    <label class="normal-text" for="edit-page-title-input">Title</label>
                    <input class="large-text" id="edit-page-title-input" placeholder="Type something...">

                    <label class="normal-text" for="edit-page-content-input">Content</label>
                    <textarea class="normal-text" id="edit-page-content-input" placeholder="Type something..."></textarea>

                    <button class="large-text text-button" id="edit-page-save">Create Post</button>

                    <p class="normal-text" id="edit-page-notice"></p>
                </div>

                <div id="edit-page-right">
                    <p class="large-text page-title" id="edit-page-preview-title">Preview will appear here...</p>
                    <p id="edit-page-preview" class="post-markdown-container"></p>
                </div>
            </div>
        </div>
    </div>

    <div id="image-viewer" style="display: none;">
        <img class="viewer-image" alt="Alt Text" title="Alt Text" src="/assets/placeholder.png">
        <p class="image-viewer-text">Alt Text</p>
        <small class="image-viewer-instructions">Click anywhere to close</small>
    </div>

    <!-- Example Post -->
    <div class="post" style="display: none;">
        <span class="large-text">Post Title <img class="post-link" src="/assets/link.png" alt="Copy link to post"
                title="Copy link to post"></span>
        <p class="normal-text">Post Content</p>
        <div class="post-image-container">
            <img class="post-image" src="/assets/placeholder.png" alt="Post Img 1" title="Post Img 1">
            <img class="post-image" src="/assets/placeholder.png" alt="Post Img 2" title="Post Img 2">
        </div>
        <small class="small-text">Post Info</small>
    </div>
</body>


<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="/script.js"></script>

</html>
